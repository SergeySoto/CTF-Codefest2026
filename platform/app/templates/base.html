<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Codefest CTF{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body class="{% block clase %}{% endblock %}">
<!--
  THESIS: la interfaz ES una sesión de terminal en un tubo de fósforo verde —
  una rejilla de celdas de carácter dibujada con reglas y glifos. Rechaza la
  cuadrícula de tarjetas redondeadas que envía cualquier plataforma de CTF.
  OWN-WORLD: fósforo P1 verde amarillento (#63e85c texto, #b6ff8f titulares,
  #eaffe4 quemado) sobre cristal apagado #030a06. VT323 local. Cero radios,
  cero sombras salvo el halo del fósforo. Marcos de 1px con el título sentado
  sobre el trazo. Barrido, viñeta y lluvia de código como capas fijas.
  STORY: alguien sin conocimientos técnicos se sienta, entiende en diez
  segundos que hay códigos escondidos, teclea uno y ve arder el fósforo.
  FIRST VIEWPORT: reloj enorme a la izquierda, tanteo a la derecha, la caja
  única cruzando toda la pantalla bajo un prompt ">", y debajo el índice de
  retos junto al visor donde el reto se abre sin cambiar de página.
  FORM: terminal monocromo CRT — mundo fijado por el encargo del usuario.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the
  finish review, the verdict, and DESIGN.md
-->
  <div class="lluvia" aria-hidden="true">
    {% for c in lluvia %}<i style="left:{{ c.izq }}%;animation-duration:{{ c.dur }}s;animation-delay:{{ c.esp }}s">{{ c.texto }}</i>{% endfor %}
  </div>
  <div class="tubo" aria-hidden="true"></div>
  <div class="destello" aria-hidden="true"></div>

  <div class="pantalla {% block clase_pantalla %}{% endblock %}">
    {% block contenido %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
