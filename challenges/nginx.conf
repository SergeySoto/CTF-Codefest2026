# El Reto 2 vive en las cookies: el servidor manda un token cuyo NOMBRE es la
# bandera y cuyo valor es aleatorio. No hay nada que adivinar en la página;
# hay que abrir las cookies del navegador y leer lo que hay.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # sin listado de directorios: los retos se descubren, no se enumeran
    autoindex off;

    # nada de ficheros ocultos ni de notas del equipo
    location ~ /\. { deny all; }
    location ~ \.(md|json|py)$ { deny all; }

    location = /reto-02/ {
        add_header Set-Cookie "idioma=es; Path=/; Max-Age=7200; SameSite=Lax";
        add_header Set-Cookie "tema=oscuro; Path=/; Max-Age=7200; SameSite=Lax";
        add_header Set-Cookie "flag{c00k13_d3_4dm1n}=$request_id; Path=/; Max-Age=7200; SameSite=Lax";
        add_header Set-Cookie "consentimiento=1; Path=/; Max-Age=7200; SameSite=Lax";
        try_files /reto-02/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
