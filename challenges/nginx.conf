server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # sin listado de directorios: los retos se descubren, no se enumeran
    autoindex off;

    # Los retos se editan durante la preparación y basta con recargar la
    # página. Sin esta cabecera Chrome guarda la copia en su caché heurística
    # (no hay Expires ni Cache-Control) y sigue enseñando la pista vieja
    # aunque el fichero ya haya cambiado en disco. Con el ETag, revalidar
    # cuesta un 304 contra localhost.
    add_header Cache-Control "no-cache";

    # nada de ficheros ocultos ni de notas del equipo
    location ~ /\. { deny all; }

    location = /reto-04/flag/flag.json {
        allow all;
    }

    location ~ \.(md|json|py)$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
