# El rol del visitante viaja en una cookie. nginx decide qué página servir
# según lo que el navegador le manda de vuelta: la bandera no sale del
# servidor hasta que la cookie dice "admin", así que no está en el código de
# la página que ve el jugador.
map $cookie_rol $pagina_reto2 {
    default  /reto-02/denegado.html;
    "admin"  /reto-02/concedido.html;
}

# Si el visitante todavía no tiene rol, se le da uno al entrar.
map $cookie_rol $nueva_cookie_rol {
    default  "";
    ""       "rol=invitado; Path=/; Max-Age=7200; SameSite=Lax";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # sin listado de directorios: los retos se descubren, no se enumeran
    autoindex off;

    # nada de ficheros ocultos ni de notas del equipo
    location ~ /\. { deny all; }
    location ~ \.(md|json|py)$ { deny all; }

    location = /reto-02/ {
        add_header Set-Cookie $nueva_cookie_rol;
        try_files $pagina_reto2 =404;
    }

    # solo se llega por la redirección interna de arriba, nunca escribiendo
    # la dirección: si no, la bandera se cogería sin tocar la cookie
    location = /reto-02/concedido.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }
}
